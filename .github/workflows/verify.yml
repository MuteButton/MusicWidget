name: Verify OnCue
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Repository hygiene
        shell: pwsh
        run: ./tools/Test-RepositoryHygiene.ps1
      - name: Build and JVM checks (no production signing secrets in CI)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:bundleRelease :app:lintRelease :app:assembleDebugAndroidTest :app:writeDependencyInventory --max-workers=2
      - name: Dependency vulnerability scan
        run: python tools/audit_dependencies.py app/build/reports/dependency-inventory.json artifacts/dependency-audit.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            artifacts/dependency-audit.json
  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [24, 31, 36]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --max-workers=2
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
